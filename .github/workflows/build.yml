name: Build APK
on:
  push:
  workflow_dispatch:
  schedule:
    # Weekly rebuild so the APK always bundles the latest yt-dlp.
    - cron: "0 3 * * 1"
permissions:
  contents: write   # needed to publish the APK to a GitHub Release
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # The runner defaults to JDK 11, but the Android Gradle plugin used by
      # python-for-android needs Java 17 ("requires Java 17 to run. You are
      # currently using Java 11"). setup-java also sets JAVA_HOME for later steps.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Android SDK/NDK and Gradle downloads (not the app build itself, so
      # yt-dlp is still fetched fresh on every build).
      - uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: buildozer-${{ runner.os }}-

      # The slow part (compiling Python and the recipes) lives in ./.buildozer.
      # The key changes every ISO week so the weekly build re-installs the newest
      # yt-dlp, and whenever the build configuration changes.
      - name: Compute cache week
        id: week
        run: echo "week=$(date +%G-%V)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: .buildozer
          key: p4a-${{ runner.os }}-${{ steps.week.outputs.week }}-${{ hashFiles('buildozer.spec', 'intent_filters.xml', 'cleartext.txt') }}

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool \
            pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 \
            cmake libffi-dev libssl-dev automake

      - name: Install buildozer
        run: |
          pip install --upgrade pip
          pip install buildozer cython==0.29.36 virtualenv

      # www.openssl.org sometimes answers 504 and fails the whole build. Fetch the
      # same official tarball from GitHub, verify its checksum, and drop it where
      # python-for-android looks, so its own download is skipped.
      - name: Pre-fetch OpenSSL source
        run: |
          d=.buildozer/android/platform/build-arm64-v8a/packages/openssl
          f=openssl-1.1.1w.tar.gz
          mkdir -p "$d"
          if [ ! -f "$d/.mark-$f" ]; then
            curl -fL --retry 5 --retry-delay 3 --retry-all-errors -o "$d/$f" \
              "https://github.com/openssl/openssl/releases/download/OpenSSL_1_1_1w/$f"
            echo "cf3098950cb4d853ad95c0841f1f9c6d3dc102dccfcacd521d93925208b76ac8  $d/$f" | sha256sum -c -
            touch "$d/.mark-$f"
          fi

      - name: Build APK
        run: |
          set -o pipefail
          # Always repackage the current sources, even when .buildozer was restored.
          rm -rf .buildozer/android/app bin
          buildozer -v android debug 2>&1 | tee build.log

      - name: Show the real error
        if: failure()
        run: |
          echo "=== lines before the failure ==="
          grep -n -B 60 "Command failed" build.log | head -120
          echo "=== error-like lines ==="
          grep -n -i -E "error:|FAILED|Exception|what went wrong" build.log | tail -40

      - name: Publish APK to the "latest" release
        if: success() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk=$(ls bin/*.apk | head -1)
          gh release delete latest --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          gh release create latest "$apk" --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --title "Latest build" \
            --notes "APK built from commit ${GITHUB_SHA::7}"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log-and-apk
          path: |
            bin/*.apk
            build.log
